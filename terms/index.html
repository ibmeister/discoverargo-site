<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argo: Terms of Use</title>
<meta name="description" content="Argo Terms of Use.">
<meta name="theme-color" content="#030A24">
<link rel="canonical" href="https://discoverargo.com/terms/">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/FrauncesVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/InterRegular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/InterSemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  /* One reading column on the landing page's night ground. */
  :root { color-scheme: dark; --night: #030A24; --ink: #EFF1F7; --muted: #A6B1CF; --thread: #B8D9F5;
    --rule: rgba(184, 217, 245, 0.14); --display: "Fraunces", Georgia, serif;
    --body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 0.975rem; line-height: 1.65; }
  .wrap { max-width: 44rem; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  a { color: var(--thread); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  :focus-visible { outline: 2px solid var(--thread); outline-offset: 3px; border-radius: 4px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.1rem; }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; color: var(--ink); text-decoration: none; font-family: var(--display); font-weight: 700; font-variation-settings: "SOFT" 100, "opsz" 48; font-size: 1.45rem; }
  .brand img { width: auto; height: 34px; }
  .pill { display: inline-flex; align-items: center; min-height: 40px; padding: 0 1.05rem; border-radius: 999px; border: 1px solid rgba(184, 217, 245, 0.35); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 0.9375rem; }
  main { padding-block: clamp(2rem, 7vw, 4rem) 3rem; }
  article h2 { margin: 0; font-family: var(--display); font-weight: 800; font-variation-settings: "SOFT" 100, "opsz" 72; font-size: clamp(2rem, 6vw, 2.6rem); line-height: 1.05; letter-spacing: -0.02em; }
  .effective { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--muted); }
  article h3 { font-size: 0.975rem; font-weight: 600; margin: 1.75rem 0 0.25rem; }
  article p { margin: 0.25rem 0 0; }
  article ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }
  article li + li { margin-top: 0.2rem; }
  article li::marker { color: var(--muted); }
  footer { border-top: 1px solid var(--rule); padding-block: 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1.5rem; font-size: 0.875rem; color: var(--muted); }
  footer nav { display: flex; gap: 1.25rem; }
  footer a { color: var(--muted); }
  footer .mail { user-select: all; color: var(--ink); }
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="../"><img src="../assets/img/balloon-120.webp" alt="" width="102" height="120"><span>Argo</span></a>
  <a class="pill" href="https://apps.apple.com/app/apple-store/id6823674049?pt=123373640&ct=website&mt=8">Download</a>
</header>
<main class="wrap">
  <article id="terms">
    <h2>Terms of Use</h2>
    <p class="effective">Effective October 17, 2026</p>

    <p style="margin-top: 1.75rem">Argo is licensed under Apple's standard <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" rel="noopener">Licensed Application End User License Agreement</a>.</p>
  </article>
</main>
<footer class="wrap">
  <div>Questions: <a class="mail" href="mailto:support@discoverargo.com">support@discoverargo.com</a></div>
  <nav aria-label="Legal"><a href="../privacy/">Privacy Policy</a><a href="../terms/">Terms of Use</a></nav>
  <div>© 2026 Argo</div>
</footer>
</body>
</html>
